<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خرید منصفانه | خرید مستقیم و اقتصادی</title>
<meta name="description" content="کاتالوگ محصولات خرید منصفانه؛ مقایسه قیمت‌ها و خرید مستقیم از عرضه‌کنندگان">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f5;color:#26352c;line-height:1.9}
header{background:#174d38;color:white;padding:25px 16px;text-align:center}
header h1{margin:0;font-size:27px}
header p{margin:5px 0 14px;color:#e2eee5}
.channel,.order{display:inline-block;background:#f0c75e;color:#24382b;padding:8px 20px;border-radius:25px;text-decoration:none;font-weight:bold}
.container{max-width:1050px;margin:auto;padding:18px}
.intro{background:white;border-radius:15px;padding:18px;text-align:center;margin-bottom:18px;box-shadow:0 2px 10px #00000008}
.search{width:100%;padding:14px;border:1px solid #d5ded7;border-radius:10px;font-size:16px;outline:none;margin-bottom:14px}
.categories{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:15px 0 22px}
.categories button{border:1px solid #cbd8ce;background:white;color:#315541;padding:8px 15px;border-radius:25px;cursor:pointer;font-size:14px}
.categories button.active{background:#174d38;color:white;border-color:#174d38}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.product{background:white;border-radius:13px;overflow:hidden;box-shadow:0 2px 10px #0000000b;text-align:center}
.product-visual{height:155px;display:flex;align-items:center;justify-content:center;font-size:76px;background:linear-gradient(135deg,#f8f0df,#e7efdf)}
.product-info{padding:13px}
.product h3{margin:0 0 5px;font-size:17px}
.price{color:#176b43;font-weight:bold;font-size:17px}
.unit{font-size:12px;color:#68766d;font-weight:normal}
.order{background:#174d38;color:#fff;padding:6px 16px;margin-top:10px}
.empty{text-align:center;background:white;border-radius:12px;padding:30px 15px;color:#68766d;grid-column:1/-1}
footer{margin-top:35px;background:#174d38;color:white;text-align:center;padding:20px}
footer a{color:#f0c75e}
</style>
</head>
<body>
<header>
 <h1>خرید منصفانه</h1>
 <p>خرید مستقیم، قیمت مناسب، حمایت از تولیدکننده</p>
 <a class="channel" href="https://eitaa.com/monsefanebekhar" target="_blank" rel="noopener">عضویت در کانال ایتا</a>
</header>
<main class="container">
 <section class="intro">
  <h2>بازار منصفانه شما</h2>
  <p>محصولات را جست‌وجو کنید و قیمت‌ها را مقایسه کنید.</p>
  <small>تمام قیمت‌های نمایش‌داده‌شده به‌ازای هر کیلوگرم و به تومان هستند.</small>
 </section>
 <input id="search" class="search" type="search" placeholder="نام محصول را جست‌وجو کنید...">
 <div class="categories" id="categories">
  <button class="active" data-category="همه">همه کالاها</button>
  <button data-category="حبوبات">حبوبات</button>
  <button data-category="مواد غذایی">مواد غذایی</button>
  <button data-category="پروتئینی">محصولات پروتئینی</button>
  <button data-category="سایر">سایر محصولات</button>
 </div>
 <section class="products" id="products"></section>
</main>
<footer>
 <p>خرید منصفانه | از تولیدکننده تا مصرف‌کننده</p>
 <a href="https://eitaa.com/monsefanebekhar" target="_blank" rel="noopener">کانال رسمی ایتا</a>
</footer>
<script>
const products = [
 {name:"عدس",price:165000,category:"حبوبات",emoji:"🫘"},
 {name:"لوبیا چیتی ارتشی",price:320000,category:"حبوبات",emoji:"🫘"},
 {name:"لوبیا چیتی ساده",price:300000,category:"حبوبات",emoji:"🫘"},
 {name:"نخود",price:280000,category:"حبوبات",emoji:"🟡"},
 {name:"لپه",price:300000,category:"حبوبات",emoji:"🟡"},
 {name:"کباب مرغ",price:950000,category:"پروتئینی",emoji:"🍢"},
 {name:"فلافل",price:300000,category:"مواد غذایی",emoji:"🧆"},
 {name:"زیتون پرورده",price:250000,category:"سایر",emoji:"🫒"},
 {name:"عسل ممتاز",price:1000000,category:"سایر",emoji:"🍯"},
 {name:"عسل اقتصادی",price:450000,category:"سایر",emoji:"🍯"},
 {name:"خرمای بی‌هسته",price:185000,category:"سایر",emoji:"🌴"}
];
let selectedCategory = "همه";
const formatPrice = value => new Intl.NumberFormat('fa-IR').format(value);
function renderProducts(){
 const search = document.getElementById("search").value.trim();
 const area = document.getElementById("products");
 const filtered = products.filter(p =>
  (selectedCategory === "همه" || p.category === selectedCategory) && p.name.includes(search)
 );
 if(filtered.length === 0){
  area.innerHTML = '<div class="empty"><h3>محصولی پیدا نشد</h3><p>نام محصول دیگری را جست‌وجو کنید.</p></div>';
  return;
 }
 area.innerHTML = filtered.map(p => `
  <article class="product">
   <div class="product-visual" role="img" aria-label="${p.name}">${p.emoji}</div>
   <div class="product-info">
    <h3>${p.name}</h3>
    <div class="price">${formatPrice(p.price)} تومان <span class="unit">/ کیلوگرم</span></div>
    <a class="order" href="https://eitaa.com/monsefanebekhar" target="_blank" rel="noopener">سفارش از ایتا</a>
   </div>
  </article>
 `).join("");
}
document.getElementById("search").addEventListener("input",renderProducts);
document.querySelectorAll(".categories button").forEach(button=>{
 button.addEventListener("click",()=>{
  document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  selectedCategory=button.dataset.category;
  renderProducts();
 });
});
renderProducts();
</script>
</body>
</html>
